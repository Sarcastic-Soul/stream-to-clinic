name: Deploy backend

# Pushes to main that touch the backend redeploy the EC2 box through SSM Run Command.
# No SSH port or long-lived AWS keys: GitHub OIDC assumes a role that may only
# run shell commands on the tagged hackathon instance.
on:
  push:
    branches: [main]
    paths:
      - api/**
      - fhir/**
      - deploy/**
      - .github/workflows/deploy-backend.yml
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Run deploy on the EC2 box
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          SHA: ${{ github.sha }}
        run: |
          params=$(jq -n --arg sha "$SHA" '{commands: [
            "set -euo pipefail",
            "[ -d /srv/stream-to-clinic/.git ] || git clone --quiet https://github.com/Sarcastic-Soul/stream-to-clinic.git /srv/stream-to-clinic",
            "cd /srv/stream-to-clinic",
            "git fetch --quiet origin main",
            ("git reset --hard " + $sha),
            "bash deploy/deploy.sh"
          ], executionTimeout: ["1200"]}')
          cmd_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "stream-to-clinic ${SHA::7}" \
            --parameters "$params" \
            --query Command.CommandId --output text)
          echo "SSM command: $cmd_id"

          while true; do
            status=$(aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Final status: $status"
          [ "$status" = "Success" ]

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://oneaquahealth.duckdns.org/health; then exit 0; fi
            sleep 10
          done
          echo "API did not become healthy in time" >&2
          exit 1
